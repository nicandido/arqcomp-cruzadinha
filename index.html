<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cruzadinha de Arquitetura Computacional</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Cruzadinha de Arquitetura Computacional</h1>
    <p>Leia a pista, descubra o termo e digite as letras direto nas casas.
       Use as setas do teclado para andar pelo tabuleiro e a barra de espaço (ou um novo clique) para trocar entre horizontal e vertical.</p>
  </header>

  <main>
    <section class="tabuleiro" aria-label="Tabuleiro">
      <div id="grid" class="grid"></div>
    </section>

    <section class="pistas" aria-label="Pistas">
      <h2>Horizontais</h2>
      <ol id="pistas-h"></ol>
      <h2>Verticais</h2>
      <ol id="pistas-v"></ol>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
